$kind: http-request
name: Add Expense
method: POST
url: '{{baseUrl}}/api/finance/expenses'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Stationery",
      "amount": 500,
      "category": "supplies",
      "date": "2025-01-15",
      "description": "Office stationery",
      "added_by": "{{memberId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function() {
        pm.response.to.have.status(201);
      });
      pm.test("Response has expense", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("expense");
      });
