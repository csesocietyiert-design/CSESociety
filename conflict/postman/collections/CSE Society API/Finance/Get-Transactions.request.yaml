$kind: http-request
name: Get Transactions
method: GET
url: '{{baseUrl}}/api/finance/transactions'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has transactions and budget", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("transactions");
        pm.expect(json).to.have.property("budget");
      });
