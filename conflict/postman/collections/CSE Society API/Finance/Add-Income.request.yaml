$kind: http-request
name: Add Income
method: POST
url: '{{baseUrl}}/api/finance/income'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Membership Fee",
      "amount": 2000,
      "category": "membership",
      "date": "2025-01-15",
      "description": "Annual membership fee",
      "added_by": "{{memberId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function() {
        pm.response.to.have.status(201);
      });
      pm.test("Response has income", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("income");
      });
