$kind: http-request
name: Get All Income
method: GET
url: '{{baseUrl}}/api/finance/income'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has income array", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("income");
        pm.expect(json.income).to.be.an("array");
      });
