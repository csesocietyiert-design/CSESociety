$kind: http-request
name: Update Member
method: PATCH
url: '{{baseUrl}}/api/members/{{memberId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "8888888888"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has member", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("member");
      });
