$kind: http-request
name: Get All Announcements
method: GET
url: '{{baseUrl}}/api/announcements'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has announcements array", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("announcements");
        pm.expect(json.announcements).to.be.an("array");
        if (json.announcements?.length > 0) pm.environment.set("announcementId", json.announcements[0].id);
      });
