$kind: http-request
name: Get Announcement by ID
method: GET
url: '{{baseUrl}}/api/announcements/{{announcementId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has announcement", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("announcement");
      });
