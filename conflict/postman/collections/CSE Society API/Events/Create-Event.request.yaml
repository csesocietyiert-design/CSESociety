$kind: http-request
name: Create Event
method: POST
url: '{{baseUrl}}/api/events'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Tech Talk 2025",
      "description": "Annual tech talk",
      "event_date": "2025-12-01T10:00:00Z",
      "venue": "Seminar Hall",
      "capacity": 100,
      "created_by": "{{memberId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function() {
        pm.response.to.have.status(201);
      });
      pm.test("Response has event", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("event");
        pm.environment.set("eventId", json.event?.id);
      });
