$kind: http-request
name: Update Event
method: PATCH
url: '{{baseUrl}}/api/events/{{eventId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "venue": "Main Auditorium"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has event", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("event");
      });
