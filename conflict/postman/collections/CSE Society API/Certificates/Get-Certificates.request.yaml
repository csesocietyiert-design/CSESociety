$kind: http-request
name: Get Certificates
method: GET
url: '{{baseUrl}}/api/certificates'
order: 1000
queryParams:
  - key: member_id
    value: '{{memberId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has certificates array", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property("certificates");
        pm.expect(json.certificates).to.be.an("array");
      });
